[project]
name = "tababax"
dynamic = ["version"]
description = "TabAbax: sklearn estimators for tabular classification and regression"
readme = "README.md"
authors = [
    { name = "TabAbax Research Team" },
]
maintainers = [
    { name = "TabAbax Research Team" },
]
license = { file = "LICENSE" }
license-files = [
    "LICENSE",
    "NOTICE",
    "LICENSES/Apache-2.0.txt",
    "LICENSES/BSD-3-Clause.txt",
    "LICENSES/MIT.txt",
    "LICENSES/scikit-learn-BSD-3-Clause.txt",
    "PROVENANCE.md",
]
requires-python = ">=3.10"
keywords = ["tabular data", "TabAbax"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: BSD License",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "torch>=2.2",
    "scikit-learn>=1.3.0",
    "numpy",
    "scipy",
    "pandas",
    "einops>=0.7",
    "psutil",
    "tqdm>=4.64.0",
    "huggingface-hub",
]

[project.optional-dependencies]
test = [
    "pytest",
    "build",
    "pyarrow",
]

[project.urls]
Homepage = "https://github.com/tababax-research/TabAbax"
Repository = "https://github.com/tababax-research/TabAbax"
Documentation = "https://github.com/tababax-research/TabAbax#readme"
Source = "https://github.com/soda-inria/tabicl"

[build-system]
requires = ["hatchling>=1.26.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tababax/__about__.py"

[tool.hatch.build.targets.sdist]
only-include = [
    "src/tababax",
    "LICENSE",
    "NOTICE",
    "README.md",
    "requirements.txt",
    "PROVENANCE.md",
    "LICENSES",
    "results",
    "benchmark",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tababax"]

[tool.hatch.envs.default]
installer = "uv"

[tool.hatch.envs.hatch-test]
default-args = ["tests"]
installer = "uv"
features = ["test"]
